<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle & Color Kids Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .bouncy-btn {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s ease;
        }
        .bouncy-btn:hover {
            transform: scale(1.05) translateY(-2px);
        }
        .bouncy-btn:active {
            transform: scale(0.95) translateY(2px);
        }
        /* Custom scrollbar styling for playful aesthetic */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #FEF3C7;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #F59E0B;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #D97706;
        }
        .canvas-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen flex flex-col overflow-x-hidden selection:bg-yellow-200">

    <!-- Header Navbar -->
    <header class="bg-yellow-400 border-b-4 border-yellow-500 px-4 py-3 shadow-md flex justify-between items-center z-10">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
            <div class="bg-white p-2 rounded-2xl shadow-inner transform -rotate-3">
                <i class="fa-solid fa-wand-magic-sparkles text-3xl text-pink-500 animate-pulse"></i>
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-indigo-900 tracking-wide drop-shadow-sm">DoodleJoy!</h1>
                <p class="text-xs text-indigo-800 font-bold hidden sm:block">Step-by-Step Drawing & Coloring Studio</p>
            </div>
        </div>

        <div class="flex items-center space-x-2 md:space-x-3">
            <button id="soundToggleBtn" onclick="toggleSound()" class="bouncy-btn bg-pink-500 hover:bg-pink-600 text-white font-bold p-3 rounded-2xl shadow-md border-b-4 border-pink-700 flex items-center justify-center">
                <i id="soundIcon" class="fa-solid fa-volume-high text-xl"></i>
            </button>
            <button onclick="goHome()" class="bouncy-btn bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-4 py-2 md:py-2.5 rounded-2xl shadow-md border-b-4 border-emerald-700 flex items-center space-x-2">
                <i class="fa-solid fa-grid-2 text-xl"></i>
                <span class="hidden md:inline">Library</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col p-3 md:p-6 max-w-7xl mx-auto w-full">

        <!-- VIEW 1: SELECTION GALLERY -->
        <section id="galleryView" class="flex-1 flex flex-col space-y-6">
            <!-- Theme Filter Banner -->
            <div class="flex flex-col sm:flex-row justify-between items-center bg-indigo-600 rounded-3xl p-4 md:p-6 text-white shadow-lg border-b-8 border-indigo-800 space-y-4 sm:space-y-0">
                <div>
                    <h2 class="text-2xl md:text-4xl font-extrabold text-yellow-300">Choose Something to Draw! 🎨</h2>
                    <p class="text-indigo-100 text-sm md:text-base mt-1">Pick your favorite animal or fruit to start step-by-step!</p>
                </div>
                <!-- Category Tabs -->
                <div class="flex bg-indigo-800 p-1.5 rounded-2xl border border-indigo-500 space-x-2">
                    <button id="tabAll" onclick="filterCategory('all')" class="category-tab active bg-yellow-400 text-indigo-950 px-4 py-2 rounded-xl font-bold transition shadow-sm">
                        All (50+)
                    </button>
                    <button id="tabAnimals" onclick="filterCategory('animals')" class="category-tab text-white hover:bg-indigo-700 px-4 py-2 rounded-xl font-bold transition">
                        🐶 Animals (25)
                    </button>
                    <button id="tabFruits" onclick="filterCategory('fruits')" class="category-tab text-white hover:bg-indigo-700 px-4 py-2 rounded-xl font-bold transition">
                        🍎 Fruits & Veggies (25)
                    </button>
                </div>
            </div>

            <!-- Search and Filter Bar -->
            <div class="flex justify-between items-center bg-white rounded-2xl p-3 shadow border-2 border-amber-200">
                <div class="relative flex-1 max-w-md">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="searchDoodles()" placeholder="Search Lion, Apple, Panda..." class="w-full pl-10 pr-4 py-2 rounded-xl bg-amber-50 border border-amber-200 focus:outline-none focus:ring-2 focus:ring-yellow-400 text-slate-700 font-bold">
                </div>
                <div id="doodleCountBadge" class="text-xs md:text-sm font-bold text-amber-800 bg-amber-100 px-3 py-1.5 rounded-xl border border-amber-300 ml-2">
                    Showing 50 items
                </div>
            </div>

            <!-- Doodle Cards Grid -->
            <div id="doodleGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6 pb-12">
                <!-- Dynamically populated via JS -->
            </div>
        </section>

        <!-- VIEW 2: INTERACTIVE STUDIO (Drawing & Coloring Canvas) -->
        <section id="studioView" class="hidden flex-1 flex flex-col space-y-4">
            <!-- Top Controls Toolbar -->
            <div class="flex flex-wrap items-center justify-between bg-white rounded-2xl p-3 shadow-md border-2 border-amber-200 gap-2">
                <div class="flex items-center space-x-3">
                    <button onclick="goHome()" class="bouncy-btn bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl font-bold text-sm flex items-center space-x-1">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back</span>
                    </button>
                    <div class="flex items-center space-x-2">
                        <span id="activeEmoji" class="text-2xl">🦁</span>
                        <h2 id="activeTitle" class="text-xl md:text-2xl font-black text-indigo-950">Lion Doodle</h2>
                    </div>
                </div>

                <!-- Studio Mode Switcher: Step Guide vs Coloring Mode -->
                <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                    <button id="modeDrawBtn" onclick="switchStudioMode('draw')" class="bouncy-btn px-4 py-1.5 rounded-lg font-bold text-sm flex items-center space-x-2 bg-indigo-600 text-white shadow-sm">
                        <i class="fa-solid fa-pencil"></i>
                        <span>Step Guide</span>
                    </button>
                    <button id="modeColorBtn" onclick="switchStudioMode('color')" class="bouncy-btn px-4 py-1.5 rounded-lg font-bold text-sm flex items-center space-x-2 text-slate-600 hover:text-indigo-600">
                        <i class="fa-solid fa-paint-bucket"></i>
                        <span>Coloring Mode</span>
                    </button>
                </div>

                <!-- General Actions -->
                <div class="flex items-center space-x-2">
                    <button onclick="undo()" title="Undo" class="bouncy-btn bg-amber-100 hover:bg-amber-200 text-amber-800 p-2.5 rounded-xl font-bold border border-amber-300">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                    <button onclick="redo()" title="Redo" class="bouncy-btn bg-amber-100 hover:bg-amber-200 text-amber-800 p-2.5 rounded-xl font-bold border border-amber-300">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                    <button onclick="clearCanvas()" title="Clear Canvas" class="bouncy-btn bg-rose-100 hover:bg-rose-200 text-rose-700 p-2.5 rounded-xl font-bold border border-rose-300">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    <button onclick="printDrawing()" title="Print Worksheet" class="bouncy-btn bg-sky-100 hover:bg-sky-200 text-sky-700 p-2.5 rounded-xl font-bold border border-sky-300">
                        <i class="fa-solid fa-print"></i>
                    </button>
                    <button onclick="downloadImage()" class="bouncy-btn bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-sm flex items-center space-x-1 shadow-md border-b-2 border-emerald-700">
                        <i class="fa-solid fa-download"></i>
                        <span class="hidden sm:inline">Save</span>
                    </button>
                </div>
            </div>

            <!-- Main Interactive Canvas Area -->
            <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">

                <!-- Left Sidebar / Tools Panel -->
                <div class="lg:col-span-3 bg-white rounded-3xl p-4 shadow-md border-2 border-amber-200 flex flex-col space-y-4">

                    <!-- STEP DRAWING STEPPER CONTROLS (Only visible in Draw Mode) -->
                    <div id="stepGuideControls" class="flex flex-col space-y-3 bg-yellow-50 p-3 rounded-2xl border border-yellow-200">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-black uppercase text-amber-800 tracking-wider">Guide Steps</span>
                            <span id="stepCounter" class="text-sm font-extrabold bg-yellow-400 text-yellow-950 px-2 py-0.5 rounded-full">Step 1 / 4</span>
                        </div>
                        <p id="stepInstruction" class="text-sm text-slate-700 font-bold bg-white p-2.5 rounded-xl border border-yellow-200 min-h-[50px] flex items-center">
                            Draw the main head shape...
                        </p>
                        <div class="grid grid-cols-2 gap-2">
                            <button id="prevStepBtn" onclick="changeStep(-1)" class="bouncy-btn bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded-xl font-extrabold text-xs flex items-center justify-center space-x-1">
                                <i class="fa-solid fa-chevron-left"></i>
                                <span>Prev Step</span>
                            </button>
                            <button id="nextStepBtn" onclick="changeStep(1)" class="bouncy-btn bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl font-extrabold text-xs flex items-center justify-center space-x-1">
                                <span>Next Step</span>
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>

                    <!-- DRAWING / COLORING TOOLS -->
                    <div class="flex flex-col space-y-2">
                        <label class="text-xs font-black uppercase text-slate-400 tracking-wider">Choose Tool</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button id="toolPencil" onclick="setTool('pencil')" class="tool-btn bg-indigo-50 border-2 border-indigo-500 text-indigo-900 p-2.5 rounded-xl font-bold text-xs flex items-center space-x-2">
                                <i class="fa-solid fa-pencil text-base text-indigo-600"></i>
                                <span>Pencil / Pen</span>
                            </button>
                            <button id="toolBucket" onclick="setTool('bucket')" class="tool-btn bg-slate-50 border-2 border-slate-200 text-slate-700 p-2.5 rounded-xl font-bold text-xs flex items-center space-x-2">
                                <i class="fa-solid fa-fill-drip text-base text-pink-500"></i>
                                <span>Paint Bucket</span>
                            </button>
                            <button id="toolMarker" onclick="setTool('marker')" class="tool-btn bg-slate-50 border-2 border-slate-200 text-slate-700 p-2.5 rounded-xl font-bold text-xs flex items-center space-x-2">
                                <i class="fa-solid fa-highlighter text-base text-amber-500"></i>
                                <span>Marker Brush</span>
                            </button>
                            <button id="toolRainbow" onclick="setTool('rainbow')" class="tool-btn bg-slate-50 border-2 border-slate-200 text-slate-700 p-2.5 rounded-xl font-bold text-xs flex items-center space-x-2">
                                <i class="fa-solid fa-wand-magic-sparkles text-base text-purple-500"></i>
                                <span>Magic Rainbow</span>
                            </button>
                            <button id="toolEraser" onclick="setTool('eraser')" class="tool-btn bg-slate-50 border-2 border-slate-200 text-slate-700 p-2.5 rounded-xl font-bold text-xs flex items-center space-x-2">
                                <i class="fa-solid fa-eraser text-base text-rose-500"></i>
                                <span>Eraser</span>
                            </button>
                            <button id="toolSticker" onclick="setTool('sticker')" class="tool-btn bg-slate-50 border-2 border-slate-200 text-slate-700 p-2.5 rounded-xl font-bold text-xs flex items-center space-x-2">
                                <i class="fa-solid fa-star text-base text-yellow-500"></i>
                                <span>Stickers</span>
                            </button>
                        </div>
                    </div>

                    <!-- BRUSH SIZE SELECTOR -->
                    <div id="sizeSelector" class="flex flex-col space-y-1">
                        <div class="flex justify-between text-xs font-bold text-slate-500">
                            <span>Brush Size</span>
                            <span id="brushSizeVal">8px</span>
                        </div>
                        <input type="range" id="brushSizeRange" min="3" max="36" value="8" oninput="updateBrushSize(this.value)" class="w-full accent-indigo-600 cursor-pointer h-2 bg-slate-200 rounded-lg">
                    </div>

                    <!-- STICKER SELECTOR (Hidden unless Sticker tool active) -->
                    <div id="stickerPicker" class="hidden flex-col space-y-2 bg-purple-50 p-2.5 rounded-2xl border border-purple-200">
                        <label class="text-xs font-bold text-purple-800">Pick a Stamp Sticker:</label>
                        <div class="flex justify-between items-center bg-white p-1 rounded-xl">
                            <button onclick="setSticker('⭐')" class="text-xl p-1.5 hover:bg-purple-100 rounded-lg">⭐</button>
                            <button onclick="setSticker('💖')" class="text-xl p-1.5 hover:bg-purple-100 rounded-lg">💖</button>
                            <button onclick="setSticker('✨')" class="text-xl p-1.5 hover:bg-purple-100 rounded-lg">✨</button>
                            <button onclick="setSticker('👑')" class="text-xl p-1.5 hover:bg-purple-100 rounded-lg">👑</button>
                            <button onclick="setSticker('🌸')" class="text-xl p-1.5 hover:bg-purple-100 rounded-lg">🌸</button>
                            <button onclick="setSticker('🎈')" class="text-xl p-1.5 hover:bg-purple-100 rounded-lg">🎈</button>
                        </div>
                    </div>

                    <!-- COLOR PALETTE -->
                    <div class="flex flex-col space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="text-xs font-black uppercase text-slate-400 tracking-wider">Color Palette</label>
                            <input type="color" id="customColorPicker" value="#4F46E5" onchange="setColor(this.value)" class="w-6 h-6 rounded-full cursor-pointer border-0 p-0">
                        </div>
                        <div id="paletteGrid" class="grid grid-cols-6 gap-2">
                            <!-- Populated with color dots via JS -->
                        </div>
                    </div>
                </div>

                <!-- Central Canvas Area -->
                <div class="lg:col-span-9 flex flex-col items-center justify-center relative bg-white rounded-3xl p-3 md:p-6 shadow-xl border-4 border-amber-300 canvas-shadow min-h-[480px]">
                    
                    <!-- Guide Overlay Container for Step-by-Step SVG Overlay -->
                    <div class="relative w-full max-w-[650px] aspect-square flex items-center justify-center bg-white rounded-2xl overflow-hidden border border-slate-100">
                        
                        <!-- Reference / Step Vector Overlay Canvas -->
                        <canvas id="guideCanvas" width="600" height="600" class="absolute inset-0 w-full h-full pointer-events-none z-10 opacity-75"></canvas>
                        
                        <!-- Drawing & Coloring Interactive Canvas -->
                        <canvas id="paintCanvas" width="600" height="600" class="absolute inset-0 w-full h-full z-20 cursor-crosshair touch-none"></canvas>

                    </div>

                    <!-- Bottom Finish Action Banner -->
                    <div class="mt-4 flex items-center justify-between w-full max-w-[650px]">
                        <div class="text-xs text-slate-400 font-bold">
                            Tip: Switch to <span class="text-indigo-600">Coloring Mode</span> to flood fill with colors!
                        </div>
                        <button onclick="triggerFinishCelebration()" class="bouncy-btn bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-500 hover:to-yellow-600 text-indigo-950 font-black px-6 py-2.5 rounded-2xl shadow-lg border-b-4 border-amber-600 flex items-center space-x-2">
                            <i class="fa-solid fa-trophy text-xl text-yellow-900"></i>
                            <span>I'm Done! Finish!</span>
                        </button>
                    </div>

                </div>

            </div>
        </section>

    </main>

    <script>
        // Audio Synthesizer using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let soundEnabled = true;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'brush') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'cheer') {
                    // Play a quick melody chime
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.type = 'sine';
                        noteOsc.frequency.setValueAtTime(freq, now + i * 0.1);
                        noteGain.gain.setValueAtTime(0.2, now + i * 0.1);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.3);
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        noteOsc.start(now + i * 0.1);
                        noteOsc.stop(now + i * 0.1 + 0.3);
                    });
                }
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggleBtn');
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                btn.className = "bouncy-btn bg-pink-500 hover:bg-pink-600 text-white font-bold p-3 rounded-2xl shadow-md border-b-4 border-pink-700 flex items-center justify-center";
                icon.className = "fa-solid fa-volume-high text-xl";
                playSound('pop');
            } else {
                btn.className = "bouncy-btn bg-slate-400 hover:bg-slate-500 text-white font-bold p-3 rounded-2xl shadow-md border-b-4 border-slate-600 flex items-center justify-center";
                icon.className = "fa-solid fa-volume-xmark text-xl";
            }
        }

        // Comprehensive Database of 50+ Doodles (25 Animals, 25 Fruits/Veggies)
        // Each entry contains vector paths organized by steps for step-by-step drawing guides.
        const DOODLE_DATABASE = [
            // --- ANIMALS (25) ---
            {
                id: 'lion', category: 'animals', name: 'Lion', emoji: '🦁',
                steps: [
                    { desc: "Draw a big circle in the middle for Lion's face.", path: (ctx) => { ctx.arc(300, 300, 80, 0, Math.PI * 2); } },
                    { desc: "Add a fluffy cloud-like mane all around the head circle.", path: (ctx) => { 
                        for(let i = 0; i < 12; i++) {
                            let angle = (i * Math.PI / 6);
                            let x = 300 + Math.cos(angle) * 110;
                            let y = 300 + Math.sin(angle) * 110;
                            ctx.moveTo(x + 35, y);
                            ctx.arc(x, y, 35, 0, Math.PI * 2);
                        }
                    }},
                    { desc: "Draw two cute eyes, a triangular nose, and a curved smile.", path: (ctx) => {
                        ctx.arc(270, 280, 10, 0, Math.PI * 2);
                        ctx.moveTo(340, 280); ctx.arc(330, 280, 10, 0, Math.PI * 2);
                        ctx.moveTo(300, 310); ctx.lineTo(285, 300); ctx.lineTo(315, 300); ctx.closePath();
                        ctx.moveTo(300, 310); ctx.quadraticCurveTo(290, 330, 280, 320);
                        ctx.moveTo(300, 310); ctx.quadraticCurveTo(310, 330, 320, 320);
                    }},
                    { desc: "Draw an oval body below with paws!", path: (ctx) => {
                        ctx.ellipse(300, 440, 60, 80, 0, 0, Math.PI * 2);
                        ctx.rect(260, 490, 30, 30); ctx.rect(310, 490, 30, 30);
                    }}
                ]
            },
            {
                id: 'panda', category: 'animals', name: 'Panda', emoji: '🐼',
                steps: [
                    { desc: "Draw a large rounded head circle.", path: (ctx) => { ctx.arc(300, 280, 100, 0, Math.PI * 2); } },
                    { desc: "Add two round ears on top and dark eye patches.", path: (ctx) => {
                        ctx.arc(220, 200, 30, 0, Math.PI * 2);
                        ctx.moveTo(410, 200); ctx.arc(380, 200, 30, 0, Math.PI * 2);
                        ctx.moveTo(275, 270); ctx.ellipse(260, 270, 25, 20, -0.2, 0, Math.PI * 2);
                        ctx.moveTo(355, 270); ctx.ellipse(340, 270, 25, 20, 0.2, 0, Math.PI * 2);
                    }},
                    { desc: "Draw eyes inside the patches, a nose, and mouth.", path: (ctx) => {
                        ctx.arc(260, 270, 8, 0, Math.PI * 2);
                        ctx.moveTo(348, 270); ctx.arc(340, 270, 8, 0, Math.PI * 2);
                        ctx.moveTo(300, 300); ctx.ellipse(300, 300, 15, 10, 0, 0, Math.PI * 2);
                        ctx.moveTo(300, 310); ctx.lineTo(300, 325);
                    }},
                    { desc: "Draw the round chubby body and cute paws.", path: (ctx) => {
                        ctx.ellipse(300, 430, 90, 70, 0, 0, Math.PI * 2);
                        ctx.ellipse(220, 410, 30, 40, 0.3, 0, Math.PI * 2);
                        ctx.ellipse(380, 410, 30, 40, -0.3, 0, Math.PI * 2);
                    }}
                ]
            },
            {
                id: 'elephant', category: 'animals', name: 'Elephant', emoji: '🐘',
                steps: [
                    { desc: "Draw a big round body and head circle.", path: (ctx) => { ctx.arc(280, 280, 90, 0, Math.PI * 2); } },
                    { desc: "Draw a long curving trunk in front.", path: (ctx) => {
                        ctx.moveTo(210, 290);
                        ctx.quadraticCurveTo(150, 320, 160, 380);
                        ctx.quadraticCurveTo(170, 410, 200, 390);
                        ctx.quadraticCurveTo(180, 350, 230, 320);
                    }},
                    { desc: "Add giant floppy ear flap on the side.", path: (ctx) => {
                        ctx.ellipse(370, 280, 60, 80, 0.2, 0, Math.PI * 2);
                    }},
                    { desc: "Draw 4 sturdy tree-trunk legs and a cute tail.", path: (ctx) => {
                        ctx.rect(230, 350, 35, 100); ctx.rect(290, 350, 35, 100);
                        ctx.rect(340, 340, 35, 90);
                        ctx.moveTo(410, 310); ctx.quadraticCurveTo(440, 330, 435, 370);
                    }}
                ]
            },
            {
                id: 'cat', category: 'animals', name: 'Cat', emoji: '🐱',

                btn.style.backgroundColor = color;
                btn.onclick = () => setColor(color);
                container.appendChild(btn);
            });
        }

        function renderGallery(filterCategory = 'all', filterQuery = '') {
            const grid = document.getElementById('doodleGrid');
            grid.innerHTML = '';

            const items = DOODLE_DATABASE.filter(item => {
                const matchCategory = filterCategory === 'all' || item.category === filterCategory;
                const matchQuery = item.name.toLowerCase().includes(filterQuery.toLowerCase());
                return matchCategory && matchQuery;
            });

            document.getElementById('doodleCountBadge').textContent = `Showing ${items.length} items`;

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl p-4 shadow-md border-2 border-amber-200 hover:border-indigo-400 bouncy-btn cursor-pointer flex flex-col items-center justify-between text-center space-y-2 group";
                card.onclick = () => openStudio(item);

                card.innerHTML = `
                    <div class="text-5xl group-hover:scale-125 transition transform duration-200 py-2">${item.emoji}</div>
                    <h3 class="font-black text-indigo-950 text-base group-hover:text-indigo-600">${item.name}</h3>
                    <span class="text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full ${item.category === 'animals' ? 'bg-pink-100 text-pink-700' : 'bg-emerald-100 text-emerald-700'}">
                        ${item.category === 'animals' ? 'Animal' : 'Fruit'}
                    </span>
                    <button class="w-full bg-yellow-400 group-hover:bg-yellow-500 text-indigo-950 font-extrabold text-xs py-1.5 rounded-xl shadow-sm border-b-2 border-yellow-600">
                        Draw Step-by-Step
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            playSound('pop');
            document.querySelectorAll('.category-tab').forEach(btn => {
                btn.className = "category-tab text-white hover:bg-indigo-700 px-4 py-2 rounded-xl font-bold transition";
            });
            if (cat === 'all') document.getElementById('tabAll').className = "category-tab active bg-yellow-400 text-indigo-950 px-4 py-2 rounded-xl font-bold transition shadow-sm";
            if (cat === 'animals') document.getElementById('tabAnimals').className = "category-tab active bg-yellow-400 text-indigo-950 px-4 py-2 rounded-xl font-bold transition shadow-sm";
            if (cat === 'fruits') document.getElementById('tabFruits').className = "category-tab active bg-yellow-400 text-indigo-950 px-4 py-2 rounded-xl font-bold transition shadow-sm";
            
            const searchVal = document.getElementById('searchInput').value;
            renderGallery(cat, searchVal);
        }

        function searchDoodles() {
            const query = document.getElementById('searchInput').value;
            const activeTab = document.querySelector('.category-tab.active').id;
            let cat = 'all';
            if (activeTab === 'tabAnimals') cat = 'animals';
            if (activeTab === 'tabFruits') cat = 'fruits';
            renderGallery(cat, query);
        }

        function goHome() {
            playSound('pop');
            document.getElementById('galleryView').classList.remove('hidden');
            document.getElementById('studioView').classList.add('hidden');
        }

        function openStudio(item) {
            playSound('pop');
            activeDoodle = item;
            currentStepIndex = 0;

            document.getElementById('activeEmoji').textContent = item.emoji;
            document.getElementById('activeTitle').textContent = `${item.name} Studio`;

            document.getElementById('galleryView').classList.add('hidden');
            document.getElementById('studioView').classList.remove('hidden');

            // Reset stacks
            undoStack = [];
            redoStack = [];

            // Clear Paint Canvas
            paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
            saveState();

            switchStudioMode('draw');
            updateStepGuide();
        }

        function switchStudioMode(mode) {
            playSound('pop');
            activeMode = mode;
            const drawBtn = document.getElementById('modeDrawBtn');
            const colorBtn = document.getElementById('modeColorBtn');
            const stepControls = document.getElementById('stepGuideControls');

            if (mode === 'draw') {
                drawBtn.className = "bouncy-btn px-4 py-1.5 rounded-lg font-bold text-sm flex items-center space-x-2 bg-indigo-600 text-white shadow-sm";
                colorBtn.className = "bouncy-btn px-4 py-1.5 rounded-lg font-bold text-sm flex items-center space-x-2 text-slate-600 hover:text-indigo-600";
                stepControls.classList.remove('hidden');
                guideCanvas.style.display = 'block';
                setTool('pencil');
            } else {
                colorBtn.className = "bouncy-btn px-4 py-1.5 rounded-lg font-bold text-sm flex items-center space-x-2 bg-indigo-600 text-white shadow-sm";
                drawBtn.className = "bouncy-btn px-4 py-1.5 rounded-lg font-bold text-sm flex items-center space-x-2 text-slate-600 hover:text-indigo-600";
                stepControls.classList.add('hidden');
                guideCanvas.style.display = 'none';
                setTool('bucket');
            }
        }

        function changeStep(delta) {
            playSound('pop');
            currentStepIndex += delta;
            if (currentStepIndex < 0) currentStepIndex = 0;
            if (currentStepIndex >= activeDoodle.steps.length) currentStepIndex = activeDoodle.steps.length - 1;
            updateStepGuide();
        }

        function updateStepGuide() {
            const total = activeDoodle.steps.length;
            const step = activeDoodle.steps[currentStepIndex];

            document.getElementById('stepCounter').textContent = `Step ${currentStepIndex + 1} / ${total}`;
            document.getElementById('stepInstruction').textContent = step.desc;

            document.getElementById('prevStepBtn').disabled = (currentStepIndex === 0);
            document.getElementById('nextStepBtn').disabled = (currentStepIndex === total - 1);

            renderGuideOverlay();
        }

        function renderGuideOverlay() {
            guideCtx.clearRect(0, 0, guideCanvas.width, guideCanvas.height);

            for (let i = 0; i <= currentStepIndex; i++) {
                const step = activeDoodle.steps[i];
                guideCtx.beginPath();
                guideCtx.lineWidth = (i === currentStepIndex) ? 6 : 4;
                guideCtx.strokeStyle = (i === currentStepIndex) ? '#4F46E5' : '#CBD5E1';
                guideCtx.lineCap = 'round';
                guideCtx.lineJoin = 'round';
                
                if (i === currentStepIndex) {
                    guideCtx.setLineDash([8, 8]); // Dashed active step for trace guidance
                } else {
                    guideCtx.setLineDash([]);
                }

                step.path(guideCtx);
                guideCtx.stroke();
            }
        }

        function initCanvas() {
            // Touch & Mouse Listeners
            paintCanvas.addEventListener('mousedown', startDrawing);
            paintCanvas.addEventListener('mousemove', draw);
            paintCanvas.addEventListener('mouseup', stopDrawing);
            paintCanvas.addEventListener('mouseleave', stopDrawing);

            paintCanvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            paintCanvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            paintCanvas.addEventListener('touchend', stopDrawing);
        }

        function getCanvasCoords(e) {
            const rect = paintCanvas.getBoundingClientRect();
            const scaleX = paintCanvas.width / rect.width;
            const scaleY = paintCanvas.height / rect.height;
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const coords = getCanvasCoords(e);
            lastX = coords.x;
            lastY = coords.y;

            if (activeTool === 'bucket') {
                floodFill(Math.round(coords.x), Math.round(coords.y), hexToRgba(primaryColor));
                saveState();
                isDrawing = false;
            } else if (activeTool === 'sticker') {
                placeSticker(coords.x, coords.y);
                saveState();
                isDrawing = false;
            } else {
                playSound('brush');
                draw(e);
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            const coords = getCanvasCoords(e);

            paintCtx.beginPath();
            paintCtx.moveTo(lastX, lastY);
            paintCtx.lineTo(coords.x, coords.y);

            if (activeTool === 'pencil') {
                paintCtx.strokeStyle = primaryColor;
                paintCtx.lineWidth = brushSize;
                paintCtx.globalAlpha = 1.0;
                paintCtx.lineCap = 'round';
                paintCtx.lineJoin = 'round';
            } else if (activeTool === 'marker') {
                paintCtx.strokeStyle = primaryColor;
                paintCtx.lineWidth = brushSize * 2;
                paintCtx.globalAlpha = 0.4;
                paintCtx.lineCap = 'square';
            } else if (activeTool === 'rainbow') {
                hueOffset = (hueOffset + 5) % 360;
                paintCtx.strokeStyle = `hsl(${hueOffset}, 100%, 50%)`;
                paintCtx.lineWidth = brushSize * 1.5;
                paintCtx.globalAlpha = 1.0;
                paintCtx.lineCap = 'round';
            } else if (activeTool === 'eraser') {
                paintCtx.globalCompositeOperation = 'destination-out';
                paintCtx.lineWidth = brushSize * 3;
                paintCtx.lineCap = 'round';
            }

            paintCtx.stroke();
            paintCtx.globalCompositeOperation = 'source-over'; // Reset blend mode

            lastX = coords.x;
            lastY = coords.y;
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                saveState();
            }
        }

        function handleTouchStart(e) {
            e.preventDefault();
            startDrawing(e);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            draw(e);
        }

        // Tools Management
        function setTool(tool) {
            playSound('pop');
            activeTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.className = "tool-btn bg-slate-50 border-2 border-slate-200 text-slate-700 p-2.5 rounded-xl font-bold text-xs flex items-center space-x-2";
            });

            const activeBtn = document.getElementById('tool' + tool.charAt(0).toUpperCase() + tool.slice(1));
            if (activeBtn) {
                activeBtn.className = "tool-btn bg-indigo-50 border-2 border-indigo-500 text-indigo-900 p-2.5 rounded-xl font-bold text-xs flex items-center space-x-2";
            }

            document.getElementById('stickerPicker').className = (tool === 'sticker') ? "flex flex-col space-y-2 bg-purple-50 p-2.5 rounded-2xl border border-purple-200" : "hidden";
        }

        function setColor(hex) {
            playSound('pop');
            primaryColor = hex;
            document.getElementById('customColorPicker').value = hex;
        }

        function updateBrushSize(val) {
            brushSize = parseInt(val);
            document.getElementById('brushSizeVal').textContent = `${val}px`;
        }

        function setSticker(emoji) {
            playSound('pop');
            selectedSticker = emoji;
        }

        function placeSticker(x, y) {
            playSound('pop');
            paintCtx.font = `${brushSize * 4}px Fredoka`;
            paintCtx.textAlign = 'center';
            paintCtx.textBaseline = 'middle';
            paintCtx.fillText(selectedSticker, x, y);
        }

        function floodFill(startX, startY, fillColor) {
            const imgData = paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height);
            const data = imgData.data;
            const width = paintCanvas.width;
            const height = paintCanvas.height;

            const targetIdx = (startY * width + startX) * 4;
            const targetColor = [
                data[targetIdx],
                data[targetIdx + 1],
                data[targetIdx + 2],
                data[targetIdx + 3]
            ];

            // Don't fill if color is nearly identical
            if (colorMatch(targetColor, fillColor, 10)) return;

            const pixelStack = [[startX, startY]];

            while (pixelStack.length) {
                const newPos = pixelStack.pop();
                const x = newPos[0];
                let y = newPos[1];

                let pixelPos = (y * width + x) * 4;

                while (y >= 0 && colorMatch(getPixelColor(data, pixelPos), targetColor, 30)) {
                    y--;
                    pixelPos -= width * 4;
                }

                pixelPos += width * 4;
                y++;

                let reachLeft = false;
                let reachRight = false;

                while (y < height && colorMatch(getPixelColor(data, pixelPos), targetColor, 30)) {
                    setPixelColor(data, pixelPos, fillColor);

                    if (x > 0) {
                        if (colorMatch(getPixelColor(data, pixelPos - 4), targetColor, 30)) {
                            if (!reachLeft) {
                                pixelStack.push([x - 1, y]);
                                reachLeft = true;
                            }
                        } else if (reachLeft) {
                            reachLeft = false;
                        }
                    }

                    if (x < width - 1) {
                        if (colorMatch(getPixelColor(data, pixelPos + 4), targetColor, 30)) {
                            if (!reachRight) {
                                pixelStack.push([x + 1, y]);
                                reachRight = true;
                            }
                        } else if (reachRight) {
                            reachRight = false;
                        }
                    }

                    y++;
                    pixelPos += width * 4;
                }
            }

            paintCtx.putImageData(imgData, 0, 0);
            playSound('pop');
        }

        function getPixelColor(data, idx) {
            return [data[idx], data[idx + 1], data[idx + 2], data[idx + 3]];
        }

        function setPixelColor(data, idx, color) {
            data[idx] = color[0];
            data[idx + 1] = color[1];
            data[idx + 2] = color[2];
            data[idx + 3] = color[3];
        }

        function colorMatch(c1, c2, tolerance) {
            return Math.abs(c1[0] - c2[0]) <= tolerance &&
                   Math.abs(c1[1] - c2[1]) <= tolerance &&
                   Math.abs(c1[2] - c2[2]) <= tolerance &&
                   Math.abs(c1[3] - c2[3]) <= tolerance;
        }

        function hexToRgba(hex) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return [(num >> 16) & 255, (num >> 8) & 255, num & 255, 255];
        }

        function saveState() {
            undoStack.push(paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height));
            if (undoStack.length > 20) undoStack.shift();
            redoStack = []; // Clear redo on new action
        }

        function undo() {
            if (undoStack.length > 1) {
                playSound('pop');
                redoStack.push(undoStack.pop());
                const state = undoStack[undoStack.length - 1];
                paintCtx.putImageData(state, 0, 0);
            }
        }

        function redo() {
            if (redoStack.length > 0) {
                playSound('pop');
                const state = redoStack.pop();
                undoStack.push(state);
                paintCtx.putImageData(state, 0, 0);
            }
        }

        function clearCanvas() {
            playSound('pop');
            paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
            saveState();
        }

        function triggerFinishCelebration() {
            playSound('cheer');
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        function downloadImage() {
            playSound('pop');
            // Merge paint canvas onto white background canvas for saving
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = 600;
            exportCanvas.height = 600;
            const expCtx = exportCanvas.getContext('2d');

            expCtx.fillStyle = '#FFFFFF';
            expCtx.fillRect(0, 0, 600, 600);
            expCtx.drawImage(paintCanvas, 0, 0);

            const link = document.createElement('a');
            link.download = `${activeDoodle.name}_DoodleJoy.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }

        function printDrawing() {
            playSound('pop');
            const printWin = window.open('', '_blank');
            printWin.document.write(`
                <html>
                    <head><title>Print ${activeDoodle.name} Worksheet</title></head>
                    <body style="text-align:center; font-family:sans-serif; padding:20px;">
                        <h2>DoodleJoy! - ${activeDoodle.name} Worksheet</h2>
                        <img src="${paintCanvas.toDataURL()}" style="border:2px solid #000; width:80%; max-width:500px;"/>
                        <p>Great Job!</p>
                        <script>window.onload = function() { window.print(); window.close(); }<\/script>
                    </body>
                </html>
            `);
            printWin.document.close();
        }
    </script>
</body>
</html>
